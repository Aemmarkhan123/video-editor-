<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Reel — Video Remix Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#111110;--bg2:#191918;--pn:#20201F;--el:#272725;--tx:#F3F0E8;--tx2:#A7A59E;--bd:#353531;--ac:#D9D3C7;--er:#b86b66;--ok:#7fa488;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--tx);font:14px/1.45 Georgia,'Times New Roman',serif}
button,input,select{font:inherit;color:inherit}
button{background:var(--el);border:1px solid var(--bd);border-radius:3px;padding:6px 12px;cursor:pointer;transition:.15s}
button:hover{border-color:var(--ac)}button.pr{background:var(--ac);color:#111;border-color:var(--ac)}button.dg:hover{border-color:var(--er);color:var(--er)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input[type=text],input[type=number],input[type=url]{background:var(--bg);border:1px solid var(--bd);border-radius:3px;padding:6px 8px;width:100%}
.app{display:grid;grid-template-columns:190px 1fr;height:100%}
aside{background:var(--bg2);border-right:1px solid var(--bd);padding:16px 10px;display:flex;flex-direction:column;gap:4px}
.brand{font-size:20px;letter-spacing:.12em;text-transform:uppercase;padding:4px 8px 16px}
aside button{text-align:left;background:none;border:0;color:var(--tx2);padding:8px}aside button.on{background:var(--el);color:var(--tx)}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--bd)}.top .sp{flex:1}
#save{color:var(--tx2);font-size:12px}
.view{display:none;flex:1;overflow:auto;padding:24px}.view.on{display:block}#studio.on{display:flex;flex-direction:column;padding:0}
h1{font-weight:400;font-size:30px;margin:0 0 6px}h2{font-weight:400;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx2);margin:24px 0 10px}
.drop{border:1px dashed var(--bd);border-radius:4px;padding:22px;background:var(--bg2);transition:.15s}.drop.over{border-color:var(--ac);background:var(--el)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row input{flex:1;min-width:200px}
.msg{margin-top:10px;color:var(--tx2);min-height:20px}.msg.er{color:var(--er)}.msg.ok{color:var(--ok)}
progress{width:100%;height:4px;accent-color:var(--ac);display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{background:var(--pn);border:1px solid var(--bd);border-radius:4px;overflow:hidden}.card video{width:100%;aspect-ratio:16/9;background:#000;display:block}
.card .b{padding:10px}.card .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card .m{color:var(--tx2);font-size:12px;margin:2px 0 8px}
.empty{color:var(--tx2);padding:24px;border:1px solid var(--bd);border-radius:4px;text-align:center}
.ws{display:grid;grid-template-columns:200px 1fr 230px;grid-template-rows:1fr 230px;flex:1;min-height:0;gap:1px;background:var(--bd)}
.ws>div{background:var(--pn);padding:10px;overflow:auto;min-width:0}
.mon{display:flex;flex-direction:column;gap:8px;align-items:center}.mon .scr{flex:1;min-height:0;width:100%;display:flex;justify-content:center;background:#000}.mon video{max-width:100%;max-height:100%;transition:opacity .1s}
.ctl{display:flex;gap:8px;align-items:center;width:100%}.ctl input[type=range]{flex:1;accent-color:var(--ac)}
.tl{grid-column:1/4;position:relative}
.tools{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
#track{position:relative;height:84px;background:var(--bg);border:1px solid var(--bd);min-width:100%;cursor:pointer}
.clip{position:absolute;top:8px;height:66px;background:var(--el);border:1px solid var(--ac);border-radius:3px;padding:4px 10px;overflow:hidden;white-space:nowrap;font-size:12px;cursor:grab;user-select:none;touch-action:none}
.clip.sel{background:#3a3934;border-width:2px}.clip i{position:absolute;top:0;bottom:0;width:7px;background:var(--ac);opacity:.7;cursor:ew-resize}.clip i.l{left:0}.clip i.r{right:0}
#ph{position:absolute;top:0;bottom:0;width:2px;background:var(--tx);pointer-events:none}
.f{margin-bottom:10px}.f label{display:block;color:var(--tx2);font-size:12px;margin-bottom:3px}.f input[type=range]{width:100%;accent-color:var(--ac)}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:9}.modal.on{display:flex}.modal>div{background:var(--pn);border:1px solid var(--bd);padding:20px;width:min(420px,92vw);border-radius:4px}
#toasts{position:fixed;right:16px;bottom:16px;display:grid;gap:6px;z-index:10}.toast{background:var(--el);border:1px solid var(--bd);padding:8px 12px;border-radius:3px}
@media(max-width:820px){.app{grid-template-columns:1fr;grid-template-rows:auto 1fr}aside{flex-direction:row;overflow:auto;padding:6px}.brand{display:none}.ws{grid-template-columns:1fr;grid-template-rows:auto}.tl{grid-column:1}}
</style></head><body>
<div class="app">
<aside><div class="brand">Reel</div>
<button data-v="home" class="on">Home</button><button data-v="library">Media Library</button><button data-v="studio">Remix Studio</button></aside>
<main>
<div class="top"><strong id="pname">Untitled project</strong><button id="ren" title="Rename project">Rename</button><span id="save">Saved</span><span class="sp"></span>
<button id="undo" title="Undo (Ctrl+Z)">Undo</button><button id="redo" title="Redo (Ctrl+Shift+Z)">Redo</button><button class="pr" id="exp">Export</button></div>

<section class="view on" id="home">
<h1>Import. Remix. Export.</h1><p style="color:var(--tx2);margin:0 0 18px">Upload a video file, send it to the studio, trim, split, change speed and volume, then export. Everything runs locally in your browser.</p>
<div class="drop" id="drop"><div class="row"><button class="pr" id="up">Upload video</button></div>
<div class="msg" id="msg">Choose a file or drop video files anywhere on this panel.</div></div>
<input type="file" id="file" accept="video/*" multiple hidden>
<h2>Recently imported</h2><div id="recent"></div>
</section>

<section class="view" id="library"><div class="row" style="margin-bottom:12px"><input type="text" id="q" placeholder="Search media…" aria-label="Search"><button id="gv">List view</button></div><div id="lib"></div></section>

<section class="view" id="studio"><div class="ws">
<div><h2 style="margin-top:0">Media</h2><div id="mp"></div></div>
<div class="mon"><div class="scr"><video id="v" playsinline></video></div>
<div class="ctl"><button id="pp">Play</button><input type="range" id="seek" min="0" max="0" step="0.01" aria-label="Seek"><span id="time">0:00 / 0:00</span><button id="fs" title="Fullscreen">⛶</button></div></div>
<div id="insp"></div>
<div class="tl"><div class="tools"><button id="split" title="S">Split</button><button id="del" class="dg" title="Delete">Delete</button><button id="dup">Duplicate</button><label style="margin-left:auto;color:var(--tx2)">Zoom <input type="range" id="zoom" min="10" max="150" value="40"></label></div>
<div style="overflow-x:auto"><div id="track"><div id="ph"></div></div></div></div>
</div></section>
</main></div>

<div class="modal" id="md"><div><h2 style="margin-top:0" id="mt">Export</h2><div id="mb"></div></div></div>
<div id="toasts" aria-live="polite"></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const fmt=s=>{s=Math.max(0,s||0);return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')};
const sz=b=>b>1e6?(b/1e6).toFixed(1)+' MB':Math.round(b/1e3)+' KB';
const uid=()=>Math.random().toString(36).slice(2,9);
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;$('#toasts').append(e);setTimeout(()=>e.remove(),3500)}
// ---- storage (IndexedDB, degrades gracefully)
const dbp=new Promise(r=>{try{const q=indexedDB.open('reel',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
async function idb(op,k,v){const d=await dbp;if(!d)return;return new Promise(r=>{try{const s=d.transaction('k',op=='get'||op=='all'?'readonly':'readwrite').objectStore('k');const q=op=='put'?s.put(v,k):op=='get'?s.get(k):op=='del'?s.delete(k):s.getAll();q.onsuccess=()=>r(q.result);q.onerror=()=>r()}catch(e){r()}})}
// ---- state
let media=[],clips=[],sel=null,hist=[],redo=[],pname='Untitled project',grid=true;
let t=0,playing=false,last=0,active=null,zoom=40;
const V=$('#v');
const dur=c=>(c.out-c.in)/c.speed,end=c=>c.start+dur(c),total=()=>Math.max(0,...clips.map(end));
const mid=id=>media.find(m=>m.id==id);
let st;function changed(){$('#save').textContent='Saving…';clearTimeout(st);st=setTimeout(async()=>{await idb('put','project',{pname,clips});$('#save').textContent='Saved'},400);renderAll()}
function push(){hist.push(JSON.stringify(clips));if(hist.length>100)hist.shift();redo=[]}
function mut(fn){push();fn();changed()}
function undo(){if(!hist.length)return;redo.push(JSON.stringify(clips));clips=JSON.parse(hist.pop());changed()}
function redoF(){if(!redo.length)return;hist.push(JSON.stringify(clips));clips=JSON.parse(redo.pop());changed()}
// ---- import
function msg(t,c=''){const m=$('#msg');m.textContent=t;m.className='msg '+c}
async function addFile(file,source){
 if(!file.type.startsWith('video/')&&!/\.(mp4|webm|mov|mkv|m4v)$/i.test(file.name)){msg(`"${file.name}" is not a video file.`,'er');return}
 const url=URL.createObjectURL(file),p=document.createElement('video');p.preload='metadata';p.src=url;
 const ok=await new Promise(r=>{p.onloadedmetadata=()=>r(true);p.onerror=()=>r(false)});
 if(!ok){msg(`Your browser can't decode "${file.name}". Try MP4 (H.264) or WebM.`,'er');return}
 const m={id:uid(),name:file.name,size:file.size,dur:p.duration,date:Date.now(),source,blob:file,url};
 media.unshift(m);await idb('put','m:'+m.id,{id:m.id,name:m.name,size:m.size,dur:m.dur,date:m.date,source,blob:file,type:'media'});
 msg(`Imported ${m.name} (${fmt(m.dur)}, ${sz(m.size)}).`,'ok');renderAll()}
$('#up').onclick=()=>$('#file').click();
$('#file').onchange=e=>{[...e.target.files].forEach(f=>addFile(f,'Local file'));e.target.value=''};
const dz=$('#drop');
['dragenter','dragover'].forEach(n=>addEventListener(n,e=>{e.preventDefault();dz.classList.add('over')}));
['dragleave','drop'].forEach(n=>addEventListener(n,e=>{e.preventDefault();dz.classList.remove('over')}));
addEventListener('drop',e=>{go('home');[...e.dataTransfer.files].forEach(f=>addFile(f,'Local file'))});
// ---- library
function cards(el,list){el.innerHTML='';
 if(!list.length){el.innerHTML='<div class="empty">No media yet. Upload a video to begin.</div>';return}
 const w=document.createElement('div');w.className=grid?'grid':'';el.append(w);
 list.forEach(m=>{const c=document.createElement('div');c.className='card';if(!grid)c.style.cssText='display:flex;margin-bottom:8px';
  const v=document.createElement('video');v.src=m.url;v.controls=true;v.preload='metadata';if(!grid)v.style.width='160px';
  const b=document.createElement('div');b.className='b';b.style.flex=1;
  b.innerHTML='<div class="n"></div><div class="m"></div>';b.firstChild.textContent=m.name;
  b.lastChild.textContent=`${fmt(m.dur)} · ${sz(m.size)} · ${new Date(m.date).toLocaleDateString()} · ${m.source}`;
  const r=document.createElement('div');r.className='row';
  const mk=(t,f,cl='')=>{const x=document.createElement('button');x.textContent=t;x.className=cl;x.onclick=f;r.append(x)};
  mk('Remix',()=>{addClip(m);go('studio')},'pr');
  mk('Rename',()=>{const n=prompt('Rename media',m.name);if(n){m.name=n;idb('put','m:'+m.id,{...m,type:'media',url:undefined});renderAll()}});
  mk('Delete',()=>{if(confirm(`Delete "${m.name}"? Clips using it will be removed.`)){media=media.filter(x=>x!=m);clips=clips.filter(c=>c.mid!=m.id);idb('del','m:'+m.id);changed()}},'dg');
  b.append(r);c.append(v,b);w.append(c)})}
$('#q').oninput=renderAll;$('#gv').onclick=()=>{grid=!grid;$('#gv').textContent=grid?'List view':'Grid view';renderAll()};
// ---- clips
function addClip(m){mut(()=>{const c={id:uid(),mid:m.id,name:m.name,start:total(),in:0,out:m.dur,speed:1,vol:1,mute:false};clips.push(c);sel=c.id})}
const cur=()=>clips.find(c=>c.id==sel);
function split(){const c=clips.find(c=>t>c.start+.05&&t<end(c)-.05&&(!sel||c.id==sel))||clips.find(c=>t>c.start+.05&&t<end(c)-.05);
 if(!c){toast('Place the playhead inside a clip to split');return}
 mut(()=>{const p=c.in+(t-c.start)*c.speed,n={...c,id:uid(),in:p,start:t,name:c.name};c.out=p;clips.push(n);sel=n.id})}
function delClip(){const c=cur();if(c&&confirm('Delete selected clip?'))mut(()=>{clips=clips.filter(x=>x!=c);sel=null})}
function dupClip(){const c=cur();if(c)mut(()=>{const n={...c,id:uid(),start:end(c)};clips.push(n);sel=n.id})}
$('#split').onclick=split;$('#del').onclick=delClip;$('#dup').onclick=dupClip;$('#undo').onclick=undo;$('#redo').onclick=redoF;
$('#ren').onclick=()=>{const n=prompt('Project name',pname);if(n){pname=n;changed()}};
$('#zoom').oninput=e=>{zoom=+e.target.value;renderTrack()};
// ---- timeline render + drag
function renderTrack(){const tr=$('#track');tr.querySelectorAll('.clip').forEach(e=>e.remove());
 tr.style.width=Math.max(total()*zoom+200,tr.parentElement.clientWidth)+'px';
 clips.forEach(c=>{const e=document.createElement('div');e.className='clip'+(c.id==sel?' sel':'');
  e.style.left=c.start*zoom+'px';e.style.width=Math.max(12,dur(c)*zoom)+'px';
  e.innerHTML='<i class="l"></i><i class="r"></i><span></span>';e.lastChild.textContent=`${c.name} · ${dur(c).toFixed(1)}s`;
  e.onpointerdown=ev=>{ev.stopPropagation();e.setPointerCapture(ev.pointerId);
   const mode=ev.target.className||'mv',x0=ev.clientX,o={...c};let pushed=false;sel=c.id;
   e.onpointermove=m=>{const d=(m.clientX-x0)/zoom;if(Math.abs(d)<.02&&!pushed)return;if(!pushed){push();pushed=true}
    if(mode=='mv')c.start=Math.max(0,o.start+d);
    else if(mode=='l'){const k=Math.min(Math.max(0,o.in+d*o.speed),o.out-.1);c.in=k;c.start=Math.max(0,o.start+(k-o.in)/o.speed)}
    else c.out=Math.min(mdur(c),Math.max(o.in+.1,o.out+d*o.speed));
    renderTrack();renderInsp()};
   e.onpointerup=()=>{e.onpointermove=null;if(pushed)changed();else renderAll()}};
  tr.append(e)})}
const mdur=c=>(mid(c.mid)||{dur:c.out}).dur;
$('#track').onpointerdown=e=>{const r=$('#track').getBoundingClientRect();t=Math.max(0,(e.clientX-r.left)/zoom);if(playing)last=performance.now();sel=null;renderAll()};
// ---- inspector
function renderInsp(){const el=$('#insp'),c=cur();
 if(!c){el.innerHTML='<h2 style="margin-top:0">Inspector</h2><div class="empty">Select a clip to edit trim, speed and volume.</div>';return}
 el.innerHTML=`<h2 style="margin-top:0">Clip</h2>
 <div class="f"><label>Name</label><input type="text" id="i_n"></div>
 <div class="f"><label>Start on timeline (s)</label><input type="number" id="i_s" step="0.1" min="0"></div>
 <div class="f row"><div style="flex:1"><label>In (s)</label><input type="number" id="i_in" step="0.1" min="0"></div><div style="flex:1"><label>Out (s)</label><input type="number" id="i_out" step="0.1"></div></div>
 <div class="f"><label>Duration on timeline: ${dur(c).toFixed(2)}s</label></div>
 <div class="f"><label>Speed ${c.speed}x</label><input type="range" id="i_sp" min="0.25" max="4" step="0.05"><div class="row" id="pre"></div></div>
 <div class="f"><label>Volume ${Math.round(c.vol*100)}%</label><input type="range" id="i_v" min="0" max="2" step="0.05"><div class="row"><label><input type="checkbox" id="i_m"> Mute</label><button id="i_r">Reset</button></div></div>`;
 const set=(id,k,f=v=>v)=>{const i=$(id);i.value=c[k];i.onchange=()=>mut(()=>{c[k]=f(i.value)})};
 set('#i_n','name');set('#i_s','start',v=>Math.max(0,+v));
 set('#i_in','in',v=>Math.min(Math.max(0,+v),c.out-.1));set('#i_out','out',v=>Math.min(mdur(c),Math.max(c.in+.1,+v)));
 const sp=$('#i_sp');sp.value=c.speed;sp.onchange=()=>mut(()=>c.speed=+sp.value);
 [.5,1,1.5,2,4].forEach(s=>{const b=document.createElement('button');b.textContent=s+'x';b.onclick=()=>mut(()=>c.speed=s);$('#pre').append(b)});
 const v=$('#i_v');v.value=c.vol;v.onchange=()=>mut(()=>c.vol=+v.value);
 const m=$('#i_m');m.checked=c.mute;m.onchange=()=>mut(()=>c.mute=m.checked);$('#i_r').onclick=()=>mut(()=>{c.vol=1;c.mute=false})}
function renderMP(){const el=$('#mp');el.innerHTML='';if(!media.length)el.innerHTML='<div class="empty">Import media from Home.</div>';
 media.forEach(m=>{const b=document.createElement('button');b.style.cssText='display:block;width:100%;text-align:left;margin-bottom:6px';b.textContent=`+ ${m.name} (${fmt(m.dur)})`;b.onclick=()=>addClip(m);el.append(b)})}
function renderAll(){
 const q=$('#q').value.toLowerCase(),list=media.filter(m=>m.name.toLowerCase().includes(q));
 cards($('#recent'),media.slice(0,4));cards($('#lib'),list);renderMP();renderTrack();renderInsp();
 $('#pname').textContent=pname;$('#undo').disabled=!hist.length;$('#redo').disabled=!redo.length}
// ---- playback engine
function sync(){
 const c=clips.find(c=>t>=c.start&&t<end(c)),m=c&&mid(c.mid);
 if(!m){V.style.opacity=0;if(!V.paused)V.pause();active=null;return}
 V.style.opacity=1;const target=c.in+(t-c.start)*c.speed;
 if(V.dataset.m!=m.id){V.src=m.url;V.dataset.m=m.id;active=null}
 if(active!==c.id){active=c.id;V.currentTime=target}else if(Math.abs(V.currentTime-target)>(playing?.35:.05))V.currentTime=target;
 V.playbackRate=c.speed;V.muted=c.mute;V.volume=Math.min(1,c.vol);
 if(playing&&V.paused)V.play().catch(()=>{});else if(!playing&&!V.paused)V.pause()}
function frame(now){if(playing){t+=(now-last)/1000;if(t>=total()){t=total();playing=false;V.pause()}}last=now;
 if($('#studio').classList.contains('on')){sync();const T=total();$('#seek').max=T;$('#seek').value=t;$('#time').textContent=fmt(t)+' / '+fmt(T);
 $('#ph').style.left=t*zoom+'px';$('#pp').textContent=playing?'Pause':'Play'}
 requestAnimationFrame(frame)}
function toggle(){if(!clips.length){toast('Add a clip to the timeline first');return}if(!playing&&t>=total())t=0;playing=!playing;last=performance.now()}
$('#pp').onclick=toggle;$('#seek').oninput=e=>{t=+e.target.value;last=performance.now()};
$('#fs').onclick=()=>$('.scr').requestFullscreen?.();
// ---- export (real-time capture of the preview via MediaRecorder)
let rec=null,cancelled=false;
$('#exp').onclick=()=>{
 if(!clips.length){toast('Nothing to export — add clips first');return}
 if(!window.MediaRecorder||!V.captureStream){openMd('Export unavailable','<p>This browser lacks MediaRecorder/captureStream. Use a recent Chrome, Edge or Firefox.</p><button id="x">Close</button>');$('#x').onclick=closeMd;return}
 openMd('Export',`<p style="color:var(--tx2)">Exports the timeline by recording the preview in real time (${fmt(total())}). Keep this tab open and in front.</p>
 <div class="f"><label>Quality</label><select id="ql"><option value="8000000">High</option><option value="4000000" selected>Standard</option><option value="1500000">Small</option></select></div>
 <progress id="ep" max="1" value="0" style="display:block"></progress><div class="msg" id="em"></div>
 <div class="row"><button class="pr" id="go">Start export</button><button id="cx">Close</button></div>`);
 $('#cx').onclick=()=>{cancelled=true;rec&&rec.state!='inactive'&&rec.stop();playing=false;closeMd()};
 $('#go').onclick=runExport}
function runExport(){
 const types=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm','video/mp4'],mt=types.find(x=>MediaRecorder.isTypeSupported(x));
 if(!mt){$('#em').textContent='No supported recording format found.';$('#em').className='msg er';return}
 go('studio');cancelled=false;t=0;sel=null;renderAll();sync();
 let s;try{s=V.captureStream()}catch(e){$('#em').textContent='Could not capture the preview: '+e.message;return}
 const ch=[];rec=new MediaRecorder(s,{mimeType:mt,videoBitsPerSecond:+$('#ql').value});
 rec.ondataavailable=e=>e.data.size&&ch.push(e.data);
 rec.onstop=()=>{playing=false;V.pause();if(cancelled)return;const b=new Blob(ch,{type:mt.split(';')[0]});
  const a=document.createElement('a'),ext=mt.includes('mp4')?'mp4':'webm';a.href=URL.createObjectURL(b);a.download=pname.replace(/\W+/g,'_')+'.'+ext;
  $('#em').textContent=`Done — ${sz(b.size)}.`;$('#em').className='msg ok';$('#ep').value=1;$('#go').textContent='Download again';$('#go').onclick=()=>a.click();a.click()};
 rec.start(500);playing=true;last=performance.now();
 const tick=()=>{if(!rec||rec.state=='inactive')return;$('#ep')&&($('#ep').value=t/(total()||1));if(!playing||t>=total())rec.stop();else requestAnimationFrame(tick)};tick();
 $('#em').textContent='Recording…';$('#go').disabled=true}
function openMd(t,h){$('#mt').textContent=t;$('#mb').innerHTML=h;$('#md').classList.add('on')}
function closeMd(){$('#md').classList.remove('on')}
// ---- nav, keys
function go(v){$$('.view').forEach(e=>e.classList.toggle('on',e.id==v));$$('aside button').forEach(b=>b.classList.toggle('on',b.dataset.v==v));if(v=='studio')renderAll()}
$$('aside button').forEach(b=>b.onclick=()=>go(b.dataset.v));
addEventListener('keydown',e=>{
 if(e.key=='Escape'){closeMd();return}
 if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)&&e.target.type!='range')return;
 const k=e.key.toLowerCase(),mod=e.ctrlKey||e.metaKey;
 if(mod&&k=='z'){e.preventDefault();e.shiftKey?redoF():undo()}
 else if(!$('#studio').classList.contains('on'))return;
 else if(k==' '){e.preventDefault();toggle()}
 else if(k=='delete'||k=='backspace'){e.preventDefault();delClip()}
 else if(k=='s'&&!mod)split();
 else if(k=='arrowleft'){t=Math.max(0,t-(e.shiftKey?1:.1));last=performance.now()}
 else if(k=='arrowright'){t=Math.min(total(),t+(e.shiftKey?1:.1));last=performance.now()}});
// ---- boot: restore persisted media + project
(async()=>{const all=(await idb('all'))||[];
 media=all.filter(x=>x&&x.type=='media'&&x.blob).map(x=>({...x,url:URL.createObjectURL(x.blob)})).sort((a,b)=>b.date-a.date);
 const p=all.find(x=>x&&x.clips);if(p){pname=p.pname;clips=p.clips.filter(c=>mid(c.mid));if(p.clips.length!=clips.length)toast('Some clips lost their media and were removed')}
 renderAll();requestAnimationFrame(frame)})();
</script></body></html>
